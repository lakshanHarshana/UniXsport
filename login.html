<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>
        (function() {
            if (localStorage.getItem('darkMode') === 'disabled') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniXsport - Login</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navbar -->
    <header class="top-navbar">
        <div class="logo">
            <img src="rajarata-logo.png" alt="Rajarata University Logo" class="university-logo">
            <div class="logo-text">
                <span class="brand-name">UniXsport</span>
                <span class="univ-tag">Rajarata University of Sri Lanka</span>
            </div>
        </div>
        <div class="navbar-right">
            <button class="icon-btn active" id="darkModeToggle" aria-label="Toggle dark mode" title="Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="main-content">
        <section class="login-section">
            <div class="login-card">
                <h1>Sign In</h1>
                <p id="loginRoleText">Continue as <strong id="loginRole">Student</strong></p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">User ID / Email</label>
                        <input type="text" id="username" placeholder="e.g. US001 or user@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                    <p class="forgot" style="margin:8px 0;color:var(--gray-600);"><a id="forgotLink" href="#">Forgot your password?</a></p>
                    <div style="display:flex;gap:12px;align-items:center;">
                        <button type="submit" class="btn btn-primary">Sign In</button>
                        <button type="button" class="btn btn-outline" id="backBtn">Back</button>
                    </div>
                    <div id="signupPrompt" style="display:none;margin-top:20px;text-align:center;font-size:0.95rem;color:var(--gray-600);">
                        Don't have an account? <a id="signupLink" href="signup.html" style="color:var(--blue);font-weight:700;text-decoration:none;transition:color 0.2s ease;" onmouseover="this.style.color='var(--blue-light)'" onmouseout="this.style.color='var(--blue)'">Sign Up</a>
                    </div>
                    <div class="login-footer">
                        <p>By signing in you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
    <script src="js/colombo-clock.js"></script>
</body>
</html>
